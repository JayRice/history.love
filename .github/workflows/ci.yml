# Phase 0A CI: migration safety gates + bundle check.
#
# Deliberately excluded for now (pre-existing debt, see
# docs/migration-status.md):
# - `expo lint`: eslint was never installed; enabling it is Phase 0B work.
# - `tsc --noEmit`: fails on pre-existing type errors in src/components
#   and on react-native-paper shipping raw .tsx.
name: ci

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

jobs:
  safety-and-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migration safety check
        run: npm run check:safety

      - name: Bundle check (Android)
        # A full Metro bundle catches unresolved imports and syntax errors
        # without an emulator. EXPO_PUBLIC_* values are inlined at bundle
        # time; CI uses placeholders (runtime validation lives in
        # src/config/env.ts).
        env:
          EXPO_PUBLIC_API_URL: https://ci-placeholder.invalid
          EXPO_PUBLIC_FIREBASE_API_KEY: ci-placeholder
        run: npx expo export --platform android
